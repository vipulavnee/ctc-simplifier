name: Keep CTC Render Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public CTC page
        run: |
          curl -L --max-time 60 --retry 2 --retry-delay 5 --silent --show-error "https://ctc-simplifier.onrender.com/#input" > /dev/null